[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imbalance-eval"
version = "0.1.0"
description = "Time series imbalance metrics via the iblr relevance function, replicating Moniz, Branco & Torgo (2017) Table 1."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "ImbalancedLearningRegression",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
imbalance-eval = "imbalance_eval:main"

[tool.setuptools]
py-modules = ["imbalance_eval"]
